# firstproject

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Oops... My Bad 😬</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #e74c3c;
    }

    p {
      font-size: 1.2em;
      color: #333;
      max-width: 500px;
      margin: 20px auto;
    }

    #forgiveBtn {
      padding: 10px 25px;
      font-size: 1rem;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }

    #message {
      margin-top: 30px;
      font-size: 1.4em;
      color: #2980b9;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Hey... My Bad 😅</h1>
  <p>I messed up. Again. But in my defense, I’m only human. A very silly one.</p>

  <button id="forgiveBtn">Forgive Me?</button>
  <div id="message">You clicked it! That means we're cool again 😎</div>

  <script>
    const btn = document.getElementById("forgiveBtn");
    const msg = document.getElementById("message");

    let tries = 0;

    btn.addEventListener("click", () => {
      tries++;
      if (tries < 3) {
        btn.style.left = `${Math.random() * 60 + 10}%`;
        btn.style.top = `${Math.random() * 60 + 10}%`;
        btn.style.position = "absolute";
        btn.textContent = "Try harder 😏";
      } else {
        msg.style.display = "block";
        btn.style.display = "none";
      }
    });
  </script>

</body>
</html>
